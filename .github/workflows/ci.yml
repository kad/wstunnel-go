name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Check go.mod is tidy (caddy)
        # pkg/caddy replaces the root module, so a root dependency bump leaves it
        # stale. Say so here instead of letting golangci-lint fail obscurely.
        run: cd pkg/caddy && go mod tidy -diff
      - name: golangci-lint (caddy)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: pkg/caddy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - name: Go Mod Tidy (root)
        run: go mod tidy
      - name: Go Mod Verify (root)
        run: go mod verify
      - name: Run Tests (root)
        run: go test -v -race ./...
      - name: Go Mod Tidy (caddy)
        run: cd pkg/caddy && go mod tidy
      - name: Go Mod Verify (caddy)
        run: cd pkg/caddy && go mod verify
      - name: Run Tests (caddy)
        run: cd pkg/caddy && go test -v -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - name: Build
        run: make build

  caddy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - name: Validate Caddy Build
        run: make check-caddy
