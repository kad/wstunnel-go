mode: server
log_lvl: INFO
server:
  listen_addr: "wss://0.0.0.0:443"
  tls_certificate: /etc/wstunnel-go/tls/fullchain.pem
  tls_private_key: /etc/wstunnel-go/tls/privkey.pem
  restrict_config: /etc/wstunnel-go/tun-rules.yaml
  enable_tun: true
  tun_udp_timeout: 30s
  tun_max_flows: 4096
  tun_max_sessions: 256
  tun_allow:
    - 10.0.0.0/8
